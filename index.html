<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Balık Sonarı – Karadeniz Av Verimi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- 🔐 Content Security Policy (CSP) -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://unpkg.com 'unsafe-inline';
  style-src  'self' https://unpkg.com https://fonts.googleapis.com 'unsafe-inline';
  img-src    'self' data: blob: https://*.tile.openstreetmap.org;
  connect-src 'self' https://api.open-meteo.com https://marine-api.open-meteo.com https://geocoding-api.open-meteo.com;
  font-src   'self' data: https://fonts.gstatic.com;
">

<!-- ✅ Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- Tipografi: Fraunces (tabela/gösterge iğnesi hissi) + IBM Plex Mono (dijital okunum) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TASARIM DİLİ — "Derinlik Göstergesi"
   Balıkçı teknelerindeki eski amper/derinlik göstergelerinden
   ve deniz haritalarının kontur çizgilerinden ilham alınmıştır.
   İmza öge: her zaman diliminde av verimini gösteren dairesel
   "sonar kadranı" — düz yüzde yazısı yerine gerçek bir derinlik
   göstergesi gibi okunur.
   ============================================================ */
:root{
  /* --- Derinlik (koyu, varsayılan) --- */
  --ink:#081319;        /* sayfa zemini: abisal lacivert-siyah */
  --ink-2:#0e1e26;       /* panel zemini */
  --ink-3:#132832;       /* kart zemini */
  --line:#20404c;        /* kontur/ayraç çizgileri */
  --foam:#eef5f2;        /* birincil metin: köpük beyazı */
  --foam-dim:#9fb9b4;    /* ikincil metin */
  --brass:#d9a05a;       /* pirinç enstrüman rengi — birincil vurgu */
  --brass-deep:#b17b3c;
  --teal:#3aa08f;        /* iyi verim */
  --coral:#e2707c;       /* düşük verim / uyarı */
  --amber:#f0bf6a;       /* çok iyi verim */
  --grid: rgba(58,160,143,.16);
  --shadow: rgba(0,0,0,.55);
  --radius-card: 18px;
}
body.light{
  /* --- Gün Işığı (açık, eskitilmiş deniz haritası kağıdı) --- */
  --ink:#f2ecda;
  --ink-2:#fffdf6;
  --ink-3:#faf3e1;
  --line:#d8c9a0;
  --foam:#20241f;
  --foam-dim:#5f6a58;
  --brass:#a8672c;
  --brass-deep:#8a5322;
  --teal:#2f7d6d;
  --coral:#b7404c;
  --amber:#c17f2e;
  --grid: rgba(47,125,109,.14);
  --shadow: rgba(90,70,40,.2);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--ink); color:var(--foam); min-height:100dvh;
  font-family:'IBM Plex Mono', 'Courier New', monospace; /* fallback; asıl gövde fontu aşağıda override edilir */
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  transition:background .35s ease, color .35s ease;
  position:relative;
  background-image:
    radial-gradient(ellipse at top, rgba(58,160,143,.06), transparent 55%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.012) 0 1px, transparent 1px 26px);
}
body.light{
  background-image:
    radial-gradient(ellipse at top, rgba(168,103,44,.08), transparent 55%),
    repeating-linear-gradient(180deg, rgba(0,0,0,.02) 0 1px, transparent 1px 26px);
}
::selection{ background:var(--brass); color:var(--ink); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
.display{ font-family:'Fraunces',Georgia,serif; }

/* === Başlık: pirinç tabela === */
header{
  padding:22px 16px 18px; text-align:center; position:relative;
  border-bottom:1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(217,160,90,.05), transparent 70%);
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--teal); margin:0 0 6px;
}
h1.brand{
  margin:0; font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:clamp(24px,5vw,34px);
  letter-spacing:.01em; color:var(--foam);
  display:flex; align-items:center; justify-content:center; gap:10px;
}
h1.brand .anchor-mark{ color:var(--brass); font-size:.85em; }
.tagline{ margin:4px 0 16px; font-size:13px; color:var(--foam-dim); }

.region-row{ display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }

.locate-icon{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  background:var(--ink-3); border:1px solid var(--line);
  cursor:pointer; transition:transform .2s, box-shadow .2s, border-color .2s; position:relative; font-size:14px;
}
.locate-icon:hover{ border-color:var(--brass); transform:scale(1.06); }
.locate-icon:active{ transform:scale(.94); }
.locate-icon:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.locate-icon::after{
  content:""; position:absolute; inset:-5px; border-radius:50%;
  box-shadow:0 0 0 0 rgba(217,160,90,.55); animation:pulse 2.4s infinite;
}
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(217,160,90,.45);} 70%{box-shadow:0 0 0 10px rgba(217,160,90,0);} 100%{box-shadow:0 0 0 0 rgba(217,160,90,0);} }
@media (prefers-reduced-motion:reduce){ .locate-icon::after{ animation:none; } }

.region-inline{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--ink-3); border:1px solid var(--brass-deep); color:var(--foam);
  border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; letter-spacing:.02em;
  box-shadow:0 4px 14px var(--shadow);
  cursor:pointer; transition:transform .15s ease, border-color .15s ease;
}
.region-inline:hover{ transform:translateY(-1px); border-color:var(--brass); }
.region-inline:active{ transform:scale(.98); }
.region-inline:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.region-chip{ font-weight:700; color:var(--brass); }
.city-chip{ opacity:.9; }
.region-warn{ font-size:12px; }

.icon-btn{
  background:var(--ink-3); color:var(--foam); border:1px solid var(--line);
  width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:15px;
  display:inline-flex; align-items:center; justify-content:center; transition:border-color .2s;
}
.icon-btn:hover{ border-color:var(--brass); }
.icon-btn:active{ transform:scale(.94); }

.menu{
  position:absolute; background:var(--ink-2); color:var(--foam);
  border:1px solid var(--line); border-radius:12px; padding:6px; min-width:170px; box-shadow:0 16px 30px var(--shadow);
  display:none; z-index:20;
}
.menu.open{ display:block; }
.menu h4{ margin:6px 8px 6px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--foam-dim); }
.menu .opt{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px; cursor:pointer; font-size:13px; }
.menu .opt:hover{ background:rgba(217,160,90,.1); }
.theme-menu-anchor{ position:relative; }

/* === Kontrol konsolu === */
.location-panel{
  padding:16px; background:var(--ink-2); display:flex; flex-direction:column; gap:10px;
  border-bottom:1px solid var(--line);
}
.console-label{
  font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--teal); display:block; margin-bottom:4px;
}
.search-row{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:center; }
.field{ flex:1 1 200px; min-width:170px; }
.field.search-field{ flex:2 1 300px; min-width:240px; }
.field.btn-field{ flex:0 0 auto; }

#locationInput, #recentLocations, #dateSelect{
  width:100%; background:var(--ink-3); color:var(--foam); caret-color:var(--brass);
  border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:14px;
  font-family:inherit; transition:border-color .2s;
}
#locationInput:focus, #recentLocations:focus, #dateSelect:focus{ outline:none; border-color:var(--brass); }
#searchButton{
  background:var(--brass); color:var(--ink); border:none; border-radius:10px; padding:11px 20px;
  font-size:14px; font-weight:700; letter-spacing:.02em; cursor:pointer; transition:all .2s; white-space:nowrap;
}
#searchButton:hover{ background:var(--amber); }
#searchButton:active{ transform:scale(.97); }
#searchButton:disabled{ opacity:.55; cursor:progress; }

/* === Harita === */
#map{
  height:min(28dvh, 280px); margin:16px; border-radius:16px; overflow:hidden;
  box-shadow:0 10px 26px var(--shadow); position:relative; z-index:1; border:1px solid var(--line);
  filter:saturate(.85);
}
@media (min-width:768px){ #map{ height:min(32dvh, 300px) } }

#loading{
  display:none; text-align:center; font-size:14px; padding:18px; font-weight:600; color:var(--teal);
  font-family:'IBM Plex Mono',monospace; letter-spacing:.05em;
}
#loading::before{ content:"◐ "; animation:spin 1s steps(4) infinite; display:inline-block; }
@keyframes spin{ 0%{content:"◐ ";} 25%{content:"◓ ";} 50%{content:"◑ ";} 75%{content:"◒ ";} }

/* === Kartlar === */
.cards{
  padding:0 16px 16px; display:grid; gap:16px;
  grid-template-columns: repeat(1, minmax(260px, 1fr));
  overflow:auto; -webkit-overflow-scrolling:touch; position:relative;
}
@media (min-width:768px){ .cards{ padding:0 24px 24px; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap:18px; } }
@media (min-width:992px){ .cards{ padding:0 32px 32px; grid-template-columns: repeat(3, minmax(280px, 1fr)); gap:18px; } }
@media (min-width:1280px){ .cards{ padding:0 40px 40px; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap:20px; } }

.card{
  background:var(--ink-3); border-radius:var(--radius-card); padding:16px;
  box-shadow:0 8px 22px var(--shadow); transition:transform .2s ease, border-color .2s ease; cursor:pointer;
  border:1px solid var(--line); outline:none; position:relative; display:flex; flex-direction:column; align-items:center; text-align:center;
}
.card:hover{ transform:translateY(-3px); border-color:var(--brass-deep); }
.card:active{ transform:scale(.97); }
.card:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.card--now{ border-color:var(--brass); }
.card--now .slot-label::after{ content:"ŞİMDİ"; margin-left:8px; font-size:9px; letter-spacing:.12em; color:var(--ink); background:var(--brass); padding:2px 6px; border-radius:999px; vertical-align:middle; }

.card-head{ width:100%; display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
.slot-label{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--foam); }
.slot-daypart{ font-size:10px; letter-spacing:.1em; color:var(--foam-dim); text-transform:uppercase; }

.dial-wrap{ position:relative; width:96px; height:96px; margin:6px 0 10px; }
.dial-wrap::before{
  content:""; position:absolute; inset:4px; border-radius:50%;
  background:repeating-conic-gradient(from 0deg, var(--grid) 0deg 1.5deg, transparent 1.5deg 30deg);
  opacity:.7;
}
.card--now .dial-wrap::after{
  content:""; position:absolute; inset:4px; border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg 305deg, var(--brass) 335deg, transparent 360deg);
  animation:sweep 5s linear infinite; mix-blend-mode:screen; opacity:.8;
}
@keyframes sweep{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce){ .card--now .dial-wrap::after{ animation:none; } }
.dial{ position:relative; z-index:1; }
.dial-track{ stroke:var(--line); }
.dial-score{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:22px; }
.dial-unit{ font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:.16em; fill:var(--foam-dim); }

.fish-name{ font-weight:700; font-size:15px; margin-bottom:6px; }
.fish-name .badge{ margin-right:4px; }

.env-mini{ font-size:12px; color:var(--foam-dim); margin-bottom:8px; line-height:1.5; }
.env-mini b{ color:var(--foam); font-weight:600; }

.top3{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:auto; padding-top:8px; }
.top3 .chip{
  display:inline-flex; align-items:center; gap:3px; background:var(--ink-2); border-radius:999px;
  padding:4px 9px; font-size:11px; border:1px solid var(--line); font-family:'IBM Plex Mono',monospace;
}

.card-empty{ color:var(--foam-dim); font-size:13px; padding:20px 0; }

/* === Modal === */
.modal{ position:fixed; inset:0; background:rgba(2,8,11,.8); display:none; z-index:2000; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
.sheet{
  width:100%; max-height:90vh; background:var(--ink-2); border-radius:22px 22px 0 0; padding:20px 18px 28px;
  overflow-y:auto; box-shadow:0 -24px 48px var(--shadow); position:relative; z-index:2001; border:1px solid var(--line); border-bottom:none;
}
.modal-top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; position:relative; gap:10px; }
.modal-top-bar h3{ margin:0; flex:1; text-align:center; font-size:15px; font-family:'IBM Plex Mono',monospace; color:var(--foam-dim); letter-spacing:.02em; }
.modal-actions{ display:flex; gap:10px; align-items:center; }
.close,.share-button{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; transition:all .2s; flex:0 0 auto; }
.close{ background:var(--ink-3); border:1px solid var(--line); color:var(--foam); }
.close:hover{ border-color:var(--coral); }
.close:active{ transform:scale(.9); }
.share-button{ background:var(--brass); color:var(--ink); border:none; }
.share-button:hover{ background:var(--amber); }
.share-button:active{ transform:scale(.9); }

.timeline{ display:flex; gap:8px; margin:14px 0 18px; overflow-x:auto; padding-bottom:6px; }
.slot{
  padding:9px 13px; border-radius:10px; background:var(--ink-3); cursor:pointer; font-size:12px; min-width:118px;
  text-align:center; transition:all .2s; border:1px solid var(--line); color:var(--foam); font-family:'IBM Plex Mono',monospace;
  flex:0 0 auto;
}
.slot:hover{ border-color:var(--brass-deep); }
.slot.active{ background:var(--brass); color:var(--ink); border-color:transparent; font-weight:700; }

.env-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0 20px; }
@media (min-width:600px){ .env-grid{ grid-template-columns:repeat(3,1fr); gap:12px; } }
.env-box{
  background:var(--ink-3); border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center;
  font-size:13px; color:var(--foam);
}
.env-box .env-label{ display:block; font-size:10px; color:var(--foam-dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; font-family:'IBM Plex Mono',monospace; }
.env-box .env-val{ font-family:'IBM Plex Mono',monospace; font-weight:600; }

.fish{ background:var(--ink-3); border:1px solid var(--line); border-radius:16px; padding:15px; margin:10px 0; transition:border-color .2s; }
.fish:hover{ border-color:var(--brass-deep); }
.fish-head{ display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:700; padding-bottom:2px; cursor:pointer; }
.fish-head .fh-score{ font-family:'IBM Plex Mono',monospace; }
.detail{ margin-top:0; max-height:0; overflow:hidden; transition:max-height .25s ease; }
.detail.open{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); max-height:600px; }
.av-comment{ font-size:14px; font-weight:600; margin:10px 0; padding:10px; border-radius:10px; text-align:center; background:rgba(0,0,0,.18); }
body.light .av-comment{ background:rgba(0,0,0,.05); }
.bar{ width:100%; height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin:8px 0;
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 10%); }
.bar > div{ height:100%; border-radius:6px; transition:width .3s ease; }
.takim-yem{ display:flex; gap:8px; align-items:flex-start; font-size:13px; margin-top:6px; }
.takim-yem .takim-icon{ flex:0 0 auto; }
.nadir{ display:inline-block; margin-top:6px; font-size:11px; color:var(--foam-dim); border:1px dashed var(--line); border-radius:8px; padding:3px 8px; font-family:'IBM Plex Mono',monospace; }
.moon-line{ font-size:12px; color:var(--foam-dim); margin-top:8px; }

.toast{
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  background:var(--ink-2); color:var(--foam); padding:10px 16px; border-radius:10px; z-index:3000;
  box-shadow:0 12px 24px var(--shadow); border:1px solid var(--line); min-width:240px; text-align:center; font-size:13px;
}
.toast.error{ background:var(--coral); color:#2a0d10; border-color:transparent; font-weight:600; }

.scroll-hint{ position:absolute; top:-8px; left:0; right:0; height:40px; pointer-events:none; display:none; }
.scroll-hint .fade{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.3), rgba(0,0,0,0)); border-radius:12px; }
.scroll-hint .msg{
  position:absolute; top:4px; left:50%; transform:translateX(-50%); background:var(--ink-2); color:var(--foam);
  font-size:11px; padding:6px 10px; border-radius:999px; border:1px solid var(--line); display:flex; align-items:center; gap:6px;
  font-family:'IBM Plex Mono',monospace;
}
.scroll-hint .chev{ animation:bounce 1.2s infinite; }
@keyframes bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(4px); } }
@media (max-width:767px){ .scroll-hint{ display:block; } }
@media (prefers-reduced-motion:reduce){ .scroll-hint .chev{ animation:none; } }
</style>
</head>
<body class="">
<header>
  <p class="eyebrow">Kıyı Balıkçılık İstasyonu</p>
  <h1 class="brand"><span class="anchor-mark">⚓</span> Balık Sonarı</h1>
  <p class="tagline">Konum, tarih ve saate göre Karadeniz kıyısında av verimi tahmini</p>

  <div class="region-row theme-menu-anchor" id="regionRow">
    <span id="regionLocateIcon" class="locate-icon" role="button" tabindex="0" aria-label="Konumumu kullan" title="Konumumu kullan">📍</span>

    <div class="region-inline" id="regionInline" role="button" tabindex="0" aria-label="Mevcut konuma git">
      <span class="region-text">
        <span id="regionName" class="region-chip">Batı Karadeniz</span>
        <span>·</span>
        <span id="cityName" class="city-chip">Amasra</span>
        <span id="regionWarn" class="region-warn" style="display:none" title="Bu konum Karadeniz kıyı şeridi dışında görünüyor; tahminler güvenilir olmayabilir">⚠️</span>
      </span>
    </div>

    <button id="themeButton" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu" title="Görünüm">⚙️</button>
    <div id="themeMenu" class="menu" role="menu" aria-label="Görünüm seçenekleri" style="top:42px; right:-8px;">
      <h4>Görünüm</h4>
      <label class="opt" role="menuitemradio" aria-checked="false"><input type="radio" name="theme" value=""> Derinlik (koyu)</label>
      <label class="opt" role="menuitemradio" aria-checked="false"><input type="radio" name="theme" value="light"> Gün Işığı</label>
    </div>
  </div>
</header>

<div class="location-panel">
  <div class="search-row">
    <div class="field search-field">
      <span class="console-label">Konum</span>
      <input type="text" id="locationInput" placeholder="Şehir/İlçe girin (ör: Amasra)" list="locationSuggestions" aria-label="Lokasyon arama">
      <datalist id="locationSuggestions"></datalist>
    </div>
    <div class="field">
      <span class="console-label">Son Aramalar</span>
      <select id="recentLocations" aria-label="Son Lokasyonlar"><option value="">Son Lokasyonlar</option></select>
    </div>
    <div class="field">
      <span class="console-label">Tarih</span>
      <select id="dateSelect" aria-label="Tarih seçimi"></select>
    </div>
    <div class="field btn-field">
      <span class="console-label">&nbsp;</span>
      <button id="searchButton" aria-label="Ara">Ara →</button>
    </div>
  </div>
</div>

<div id="map"></div>
<div id="loading" role="status" aria-live="polite">Veriler yükleniyor</div>

<div class="cards" id="cards">
  <div class="scroll-hint" id="scrollHint">
    <div class="fade"></div>
    <div class="msg">Aşağı kaydırın <span class="chev">⬇️</span></div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="slotTitle">
  <div class="sheet" tabindex="-1" id="modalSheet">
    <div class="modal-top-bar">
      <div class="modal-actions"><button class="share-button" id="shareButton" aria-label="Paneli paylaş">📤</button></div>
      <h3 id="slotTitle"></h3>
      <div class="modal-actions"><div class="close" id="modalClose" aria-label="Kapat" role="button" tabindex="0">✖</div></div>
    </div>
    <div class="timeline" id="timeline"></div>

<!-- ✅ Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* === Yardımcılar === */
function pad2(n){ return String(n).padStart(2,'0'); }
function fishIconCount(score){ if(score>=90) return 5; if(score>=80) return 4; if(score>=60) return 3; if(score>=40) return 2; if(score>=20) return 1; return 0; }
function fishIcons(score){ return '🐟'.repeat(fishIconCount(score)); }
function escapeHTML(s){ if(s==null) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
function showToast(msg,type='info'){ const el=document.createElement('div'); el.className='toast'+(type==='error'?' error':''); el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3000); }
const debounce=(fn,wait=250)=>{ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args),wait); }; };
function buildThreeHourSlots(){ const make=(s)=>({ t:`${pad2(s)}:00–${pad2(s+3)}:00`, hours:[s,s+1,s+2], timeLabel:"GÜNDÜZ" }); return [make(0),make(3),make(6),make(9),make(12),make(15),make(18),make(21)]; }
function labelBySunClock(hour,sunriseStr,sunsetStr){ const toMin=s=>{ const [H,M]=String(s||'06:00').split(':').map(Number); return H*60+M; }; const hMin=hour*60; const sr=sunriseStr?toMin(sunriseStr):360; const ss=sunsetStr?toMin(sunsetStr):1080; const tw=60; if(hMin<sr-tw||hMin>ss+tw) return "GECE"; if(Math.abs(hMin-sr)<=tw||Math.abs(hMin-ss)<=tw) return "ALACAKARANLIK"; return "GÜNDÜZ"; }

/* Tek balık türü zaman uygunluğunu kontrol eder.
   "KARMA" tüm zaman dilimleriyle uyumludur (önceden hiçbir label ile eşleşmiyordu). */
function fishTimeMatches(fishTime,label){
  if(!fishTime) return false;
  if(fishTime==="KARMA") return true;
  return fishTime.includes(label);
}

/* Mevsime göre kaba varsayılan deniz suyu sıcaklığı / dalga yüksekliği.
   Marine API veri döndürmediğinde önceki sabit 18°C/0.3m varsayımı yerine kullanılır. */
function seasonalSeaDefaults(){
  const season=DataModule.getSeason();
  const table={ "Kış":{seaTemp:9,wave:0.6}, "İlkbahar":{seaTemp:14,wave:0.5}, "Yaz":{seaTemp:23,wave:0.3}, "Sonbahar":{seaTemp:17,wave:0.6} };
  return table[season]||{seaTemp:16,wave:0.5};
}

/* Dairesel "sonar kadranı" — av verimini düz yüzde yerine gerçek bir
   derinlik/gösterge ibresi gibi çizer. Renk teması CSS değişkenleri
   üzerinden geldiği için tema değişince otomatik uyum sağlar. */
function renderDial(score){
  const size=96, stroke=8, r=(size/2)-stroke-2, c=2*Math.PI*r;
  const offset=(c-(Math.max(0,Math.min(100,score))/100)*c).toFixed(2);
  const color=ScoringModule.color(score);
  return `<svg class="dial" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Av verimi yüzde ${score}">
    <circle class="dial-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" fill="none"
      stroke="${color}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="47%" text-anchor="middle" dominant-baseline="middle" class="dial-score" fill="${color}">${score}</text>
    <text x="50%" y="65%" text-anchor="middle" dominant-baseline="middle" class="dial-unit">AV VERİMİ %</text>
  </svg>`;
}

/* === Tema menüsü (⚙️) === */
const themeButton=document.getElementById('themeButton');
const themeMenu=document.getElementById('themeMenu');
function applyThemeClass(cls){
  document.body.classList.remove('light');
  if(cls) document.body.classList.add(cls);
  localStorage.setItem('fishingThemeClass', cls || '');
}
(function initTheme(){
  const saved=localStorage.getItem('fishingThemeClass')||'';
  applyThemeClass(saved);
  [...themeMenu.querySelectorAll('input[name="theme"]')].forEach(r=>{
    r.checked=(r.value===saved);
    r.parentElement.setAttribute('aria-checked', r.checked?'true':'false');
  });
})();
themeButton.addEventListener('click', ()=>{
  const open=themeMenu.classList.toggle('open');
  themeButton.setAttribute('aria-expanded', open?'true':'false');
});
document.addEventListener('click',(e)=>{
  if(!themeMenu.contains(e.target) && e.target!==themeButton){
    themeMenu.classList.remove('open'); themeButton.setAttribute('aria-expanded','false');
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){ themeMenu.classList.remove('open'); themeButton.setAttribute('aria-expanded','false'); }
});
themeMenu.addEventListener('change',(e)=>{
  if(e.target.name==='theme'){
    const val=e.target.value;
    applyThemeClass(val);
    [...themeMenu.querySelectorAll('.opt')].forEach(l=>l.setAttribute('aria-checked','false'));
    e.target.parentElement.setAttribute('aria-checked','true');
  }
});

/* === Region ===
   Karadeniz kıyı şeridi kaba enlem/boylam sınırları içinde mi kontrol edilir. */
const REGION_BOUNDS = { latMin:40.3, latMax:42.2, lonMin:27.0, lonMax:42.0 };
const RegionModule={
  textMap:{ "Batı":"Batı Karadeniz", "Orta":"Orta Karadeniz", "Doğu":"Doğu Karadeniz" },
  getRegion(lat,lon){ if(lon<35.5) return "Batı"; if(lon<38.2) return "Orta"; return "Doğu"; },
  isWithinCoast(lat,lon){
    return lat>=REGION_BOUNDS.latMin && lat<=REGION_BOUNDS.latMax && lon>=REGION_BOUNDS.lonMin && lon<=REGION_BOUNDS.lonMax;
  },
  updateInline(cityText){
    const regionText=this.textMap[App.currentRegion]||"—";
    document.getElementById('regionName').textContent=regionText;
    document.getElementById('cityName').textContent=cityText||'—';
    const warn=document.getElementById('regionWarn');
    if(warn) warn.style.display = App.currentOutOfCoast ? 'inline' : 'none';
  }
};

/* === App === */
const App={
  currentLat:41.65, currentLon:32.38, currentDateOffset:0, currentLocationName:"Amasra", currentRegion:"Batı", currentOutOfCoast:false,
  init(){
    this.currentRegion=RegionModule.getRegion(this.currentLat,this.currentLon);
    this.currentOutOfCoast=!RegionModule.isWithinCoast(this.currentLat,this.currentLon);
    RegionModule.updateInline(this.currentLocationName);
    MapModule.init();
    this.loadRecentLocations();
    this.populateDateSelect();
    this.loadLastUsedLocation();
    this.bindSearchSuggestions();
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') UIModule.closeModal(); });
    sizeLayout();
    setupModalInteractions();
    setupRegionInline();
    setupRegionLocateIcon();
    setupScrollHint();
    CacheModule.cleanup();
  },
  populateDateSelect(){
    const select=document.getElementById('dateSelect'); select.innerHTML='';
    const today=new Date();
    for(let i=0;i<8;i++){
      const d=new Date(today); d.setDate(today.getDate()+i);
      const opt=document.createElement('option'); opt.value=i;
      opt.textContent = i===0?'Bugün': i===1?'Yarın': d.toLocaleDateString('tr-TR',{weekday:'long', day:'numeric', month:'long'});
      select.appendChild(opt);
    }
    select.value=this.currentDateOffset;
    select.onchange=()=>this.updateForecast();
  },
  suggestionMap:{},
  bindSearchSuggestions(){
    const input=document.getElementById('locationInput');
    const datalist=document.getElementById('locationSuggestions');
    input.addEventListener('input', debounce(async (e)=>{
      const q=e.target.value.trim(); if(!q){ datalist.innerHTML=''; this.suggestionMap={}; return; }
      try{
        const res=await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=tr`,12000);
        const data=await res.json();
        datalist.innerHTML=''; this.suggestionMap={};
        (data.results||[]).slice(0,5).forEach(r=>{
          const label=`${r.name}${r.country_code?' ('+r.country_code+')':''}`;
          this.suggestionMap[label]={lat:r.latitude,lon:r.longitude,name:r.name};
          const opt=document.createElement('option');
          opt.value=label;
          datalist.appendChild(opt);
        });
      }catch(err){/* sessiz */}
    },300));
  },
  searchLocation(){
    const q=document.getElementById('locationInput').value.trim(); if(!q) return;
    const match=this.suggestionMap[q];
    if(match){ MapModule.applyResolvedLocation(match.lat,match.lon,match.name); return; }

  },
  updateForecast(){ this.currentDateOffset=parseInt(document.getElementById('dateSelect').value); APIModule.fetchData(this.currentLat,this.currentLon,this.currentDateOffset); },
  setLocation(lat,lon,name="Seçilen Konum"){
    this.currentLat=lat; this.currentLon=lon; this.currentLocationName=name;
    this.currentRegion=RegionModule.getRegion(lat,lon);
    this.currentOutOfCoast=!RegionModule.isWithinCoast(lat,lon);

  saveRecentLocation(lat,lon,name){
    let recents=JSON.parse(localStorage.getItem('fishingRecents')||'[]');
    recents=recents.filter(l=>!(Math.abs(l.lat-lat)<0.01 && Math.abs(l.lon-lon)<0.01));

  },
  loadRecentLocations(){
    const select=document.getElementById('recentLocations');

    const recents=JSON.parse(localStorage.getItem('fishingRecents')||'[]');
    recents.forEach(loc=>{ const o=document.createElement('option'); o.value=JSON.stringify(loc); o.textContent=loc.name; select.appendChild(o); });

    if(!value) return; const loc=JSON.parse(value);

    if(MapModule.marker) MapModule.map.removeLayer(MapModule.marker);
    MapModule.marker=L.marker([loc.lat,loc.lon],{draggable:true}).addTo(MapModule.map).bindPopup(escapeHTML(loc.name)).openPopup();
    MapModule.marker.on('dragend',(evt)=>{ const p=evt.target.getLatLng(); this.setLocation(p.lat,p.lng,"Seçilen Konum"); });
    sizeLayout();
  },
  loadLastUsedLocation(){
    const recents=JSON.parse(localStorage.getItem('fishingRecents')||'[]');
    if(recents.length>0){ const last=recents[0]; this.setLocation(last.lat,last.lon,last.name); document.getElementById('locationInput').value=last.name; }
    else{ APIModule.fetchData(this.currentLat,this.currentLon,this.currentDateOffset); }
  }
};

  _moonCache:null,
  getMoonData(){
    const todayKey=new Date().toDateString();
    if(this._moonCache && this._moonCache.key===todayKey) return this._moonCache;
    let d=new Date(); let y=d.getUTCFullYear(), mo=d.getUTCMonth()+1, da=d.getUTCDate();
    if(mo==1||mo==2){ y--; mo+=12; }
    let a=Math.floor(y/100), b=Math.floor(a/4), c=2-a+b;
    let e=Math.floor(365.25*(y+4716)), f=Math.floor(30.6001*(mo+1));
    let jd=c+da+e+f-1524.5, days=jd-2451549.5, nm=days/29.53058867, phase=(nm-Math.floor(nm))*29.53058867;
    let text, emoji;
    if(phase<1.5){ text="Yeni Ay"; emoji="🌑"; }
    else if(phase<13.5){ text="Hilal - İlk Dördün"; emoji="🌓"; }
    else if(phase<16.5){ text="Dolunay Civarı"; emoji="🌕"; }
    else{ text="Son Dördün - Yeni Ay Civarı"; emoji="🌗"; }
    this._moonCache={ key:todayKey, phase, text, emoji };
    return this._moonCache;
  },
  getMoonPhase(){ return this.getMoonData().text; },

/* === Skor ===
   Ağırlıklar toplamı tam 100'e denk gelecek şekilde dağıtıldı (önceden 108
   idi ve Math.min(100,...) ile kırpılıp üst uçta ayrım gücü kayboluyordu). */
const ScoringModule={
  weights:{ season:18, time:14, pressure:7, moon:7, rain:7, seaTemp:19, airTemp:12, wave:7, wind:9 },
  color(sc){ return sc>90?'var(--amber)':sc>70?'var(--teal)':sc>50?'var(--brass)':'var(--coral)'; },
  gradedRangeScore(v,min,max,p,tol=0.15){ if(max<=min||p===0||v==null) return 0; const r=max-min, s=min+tol*r, e=max-tol*r; if(v>=s&&v<=e) return p; if((v>=min-tol*r&&v<s)||(v>e&&v<=max+tol*r)) return p*0.5; return 0; },
  calculate(f,env,label){
    const w=this.weights;
    let s=0, season=DataModule.getSeason(), moon=DataModule.getMoonPhase();
    if(f.seasons.includes(season)||f.seasons.includes("Tüm yıl")) s+=w.season;
    if(fishTimeMatches(f.time,label)) s+=w.time;
    if(f.pressure==="low"&&env.pressure<1013) s+=w.pressure;
    else if(f.pressure==="stable"&&env.pressure>=1012&&env.pressure<=1018) s+=w.pressure;
    else if(f.pressure==="any") s+=w.pressure*0.5;
    if(f.moon?.some?.(m=>moon.includes(m))) s+=w.moon;
    if(f.prefersRain&&env.precipProbability>40) s+=w.rain;
    s+=this.gradedRangeScore(env.seaTemp,f.seaTemp[0],f.seaTemp[1],w.seaTemp);
    s+=this.gradedRangeScore(env.airTemp,f.airTemp[0],f.airTemp[1],w.airTemp);
    if(f.wave) s+=this.gradedRangeScore(env.wave,f.wave[0],f.wave[1],w.wave);
    if(f.windRange) s+=this.gradedRangeScore(env.wind,f.windRange[0],f.windRange[1],w.wind);
    return Math.max(0,Math.min(100,Math.round(s)));
  }
};

/* === Fetch Timeout + Abort === */
async function fetchWithTimeout(url,ms=10000,signal){
  const ctrl=new AbortController();
  const id=setTimeout(()=>ctrl.abort(),ms);
  if(signal){ signal.addEventListener('abort',()=>ctrl.abort()); }
  try{ return await fetch(url,{signal:ctrl.signal}); } finally{ clearTimeout(id); }
}

/* === Basit önbellek yönetimi === */
const CacheModule={
  maxAgeMs: 3*24*60*60*1000, // 3 gün
  cleanup(){
    try{
      const now=Date.now();
      Object.keys(localStorage).forEach(key=>{
        if(!key.startsWith('wx:')) return;
        try{
          const entry=JSON.parse(localStorage.getItem(key));
          if(!entry || !entry.savedAt || (now-entry.savedAt)>this.maxAgeMs){ localStorage.removeItem(key); }
        }catch(_){ localStorage.removeItem(key); }
      });
    }catch(_){/* localStorage erişilemezse sessiz geç */}
  }
};

/* === API (3 saatlik slotlar) === */
const APIModule={
  slots:buildThreeHourSlots(),
  async fetchData(lat,lon,dayOffset=0){
    document.getElementById('loading').style.display='block';
    const targetDate=new Date(); targetDate.setDate(targetDate.getDate()+dayOffset);
    const dateStr=targetDate.toISOString().split('T')[0];
    const weatherUrl=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=sunrise,sunset&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,surface_pressure,cloud_cover,precipitation_probability&start_date=${dateStr}&end_date=${dateStr}&timezone=auto&wind_speed_unit=kmh`;
    const marineUrl=`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_surface_temperature,wave_height&start_date=${dateStr}&end_date=${dateStr}&timezone=auto`;

    const cacheKey=`wx:${lat.toFixed(3)},${lon.toFixed(3)}:${dateStr}`;
    try{
      const cached=localStorage.getItem(cacheKey);
      if(cached){ const {wData,mData}=JSON.parse(cached); this.processData(wData,mData,targetDate); document.getElementById('loading').style.display='none'; return; }
    }catch(_){}

    try{
      const [wRes,mRes]=await Promise.all([fetchWithTimeout(weatherUrl,12000), fetchWithTimeout(marineUrl,12000)]);
      const wData=await wRes.json(), mData=await mRes.json();
      if(!wData?.hourly?.time?.length) throw new Error("Hava verisi yok");
      if(!mData?.hourly?.time?.length){
        const def=seasonalSeaDefaults();
        mData.hourly={ time:wData.hourly.time.slice(), sea_surface_temperature:wData.hourly.time.map(()=>def.seaTemp), wave_height:wData.hourly.time.map(()=>def.wave) };
      }
      try{ localStorage.setItem(cacheKey, JSON.stringify({wData,mData,savedAt:Date.now()})); }catch(_){}
      this.processData(wData,mData,targetDate);
    }catch(e){ console.error(e); showToast("Veri alınamadı. Lütfen daha sonra tekrar deneyin.",'error'); }
    finally{ document.getElementById('loading').style.display='none'; }
  },
  processData(wData,mData,targetDate){
    const sunrise=wData?.daily?.sunrise?.[0]? wData.daily.sunrise[0].split('T')[1].slice(0,5):'06:00';
    const sunset =wData?.daily?.sunset?.[0]?  wData.daily.sunset[0].split('T')[1].slice(0,5):'18:00';

    const hourly=wData.hourly.time.map((t,i)=>({
      time:new Date(t),
      airTemp:wData.hourly.temperature_2m?.[i]??null,
      wind:wData.hourly.wind_speed_10m?.[i]??null,
      windDirDeg:wData.hourly.wind_direction_10m?.[i]??null,
      pressure:wData.hourly.surface_pressure?.[i]??null,
      cloud:wData.hourly.cloud_cover?.[i]??0,
      precipProbability:wData.hourly.precipitation_probability?.[i]??0,
      seaTemp:mData.hourly.sea_surface_temperature?.[i]??seasonalSeaDefaults().seaTemp,
      wave:mData.hourly.wave_height?.[i]??seasonalSeaDefaults().wave
    }));

    this.slots=buildThreeHourSlots();
    this.slots.forEach(slot=>{
      const relevant=hourly.filter(d=>slot.hours.includes(d.time.getHours()));
      if(!relevant.length) return;
      const avg=prop=>{ const vals=relevant.map(d=>d[prop]).filter(v=>typeof v==='number'); return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length:null; };
      slot.env={
        airTemp:Math.round(avg('airTemp')??0),
        seaTemp:Math.round(avg('seaTemp')??0),
        wind:Math.round(avg('wind')??0),
        windDirDeg:relevant[0].windDirDeg??null,
        windDir:this.cardinal(relevant[0].windDirDeg),
        windDirLong:this.cardinalLong(relevant[0].windDirDeg),
        wave:parseFloat((avg('wave')??0).toFixed(1)),
        pressure:Math.round(avg('pressure')??1015),
        weather:((relevant[0].cloud??0)<30?"Açık":(relevant[0].cloud??0)<70?"Bulutlu":"Kapalı"),
        precipProbability:Math.round(avg('precipProbability')??0),
        selectedDate:targetDate.toLocaleDateString('tr-TR',{weekday:'long', day:'numeric', month:'long'}),
        sunrise, sunset
      };
      const centerHour=Math.round((slot.hours[0]+slot.hours[2])/2);
      slot.timeLabel=labelBySunClock(centerHour,sunrise,sunset);
    });

    UIModule.renderCards();
    sizeLayout();
  },
  cardinal(deg){ if(deg==null||isNaN(deg)) return "—"; const d=["K","KD","D","GD","G","GB","B","KB"]; return d[Math.round(deg/45)%8]; },
  cardinalLong(deg){ if(deg==null||isNaN(deg)) return "Değişken"; const d=["Kuzey","Kuzeydoğu","Doğu","Güneydoğu","Güney","Güneybatı","Batı","Kuzeybatı"]; return d[Math.round(deg/45)%8]; }
};

/* === Harita === */
const MapModule={
  map:null, marker:null, searchAbortCtrl:null,
  init(){
    this.map=L.map('map').setView([App.currentLat,App.currentLon],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ attribution:'&copy; OpenStreetMap contributors' }).addTo(this.map);
    this.setMarker({lat:App.currentLat,lng:App.currentLon}, App.currentLocationName);
    this.map.on('click', e=>{ this.setMarker(e.latlng,"Seçilen Konum"); App.setLocation(e.latlng.lat,e.latlng.lng,"Seçilen Konum"); });
    setTimeout(sizeLayout,100);
  },
  setMarker(latlng,popupText=""){
    if(this.marker) this.map.removeLayer(this.marker);
    this.marker=L.marker(latlng,{draggable:true}).addTo(this.map);
    if(popupText) this.marker.bindPopup(escapeHTML(popupText)).openPopup();
    this.marker.on('dragend',evt=>{ const p=evt.target.getLatLng(); App.setLocation(p.lat,p.lng,"Seçilen Konum"); });
  },
  applyResolvedLocation(lat,lon,name){
    this.map.setView([lat,lon],11);
    this.setMarker({lat,lng:lon}, name);
    App.setLocation(lat,lon,name);
  },
  async searchLocation(q){
    if(this.searchAbortCtrl) this.searchAbortCtrl.abort();
    const ctrl=new AbortController(); this.searchAbortCtrl=ctrl;
    const btn=document.getElementById('searchButton');
    if(btn) btn.disabled=true;
    try{
      const res=await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=tr`,12000,ctrl.signal);
      if(ctrl.signal.aborted) return;
      const data=await res.json();
      if(ctrl.signal.aborted) return;
      if(data.results&&data.results[0]){
        const best=data.results[0]; const {latitude,longitude,name,country_code}=best;
        const nm=country_code?`${name} (${country_code})`:name;
        this.applyResolvedLocation(latitude,longitude,nm);
      }else showToast("Lokasyon bulunamadı!",'error');
    }catch(err){ if(!ctrl.signal.aborted) showToast("Lokasyon araması başarısız.",'error'); }
    finally{ if(this.searchAbortCtrl===ctrl){ this.searchAbortCtrl=null; if(btn) btn.disabled=false; } sizeLayout(); }
  }
};

/* === UI === */
const UIModule={
  activeIndex:0,
  inRegionFishes(){ return DataModule.fishes.filter(f=>f.regions?.includes(App.currentRegion)); },
  outRegionFishes(){ return DataModule.fishes.filter(f=>Array.isArray(f.regions)&&f.regions.length&&!f.regions.includes(App.currentRegion)); },
  getNowSlotIndex(){
    if(App.currentDateOffset!==0) return -1;
    const h=new Date().getHours();
    return APIModule.slots.findIndex(s=>s.hours.includes(h));
  },
  renderCards(){
    const cards=document.getElementById('cards'); cards.innerHTML='';
    const inRegion=this.inRegionFishes();
    const frag=document.createDocumentFragment();
    const nowIdx=this.getNowSlotIndex();

    APIModule.slots.forEach((slot,i)=>{
      if(!slot.env) return;
      const ranked=inRegion.map(f=>({fish:f,score:ScoringModule.calculate(f,slot.env,slot.timeLabel)})).sort((a,b)=>b.score-a.score);
      const card=document.createElement('div'); card.className='card'+(i===nowIdx?' card--now':''); card.setAttribute('role','button'); card.setAttribute('tabindex','0');

      if(!ranked.length){
        card.setAttribute('aria-label',`${slot.t} için uygun tür yok`);
        card.innerHTML=`<div class="card-head"><span class="slot-label mono">${slot.t}</span></div><div class="card-empty">Bu bölgede uygun tür bulunamadı.</div>`;
        card.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); card.click(); } });
        frag.appendChild(card); return;
      }

      const best=ranked[0];
      const windLabel=`${slot.env.wind} km/sa ${slot.env.windDir}`, windTitle=`${slot.env.wind} km/sa – ${slot.env.windDirLong}`;
      const top3=ranked.slice(0,3).map((x,idx)=>{ const p=idx===0?"🥇":idx===1?"🥈":"🥉"; return `<span class="chip" style="border-color:${ScoringModule.color(x.score)}">${p} ${escapeHTML(x.fish.name)} ${x.score}%</span>`; }).join('');
      card.setAttribute('aria-label',`${slot.t} için en iyi balık: ${best.fish.name} yüzde ${best.score}`);
      card.innerHTML=`
        <div class="card-head">
          <span class="slot-label mono">${slot.t}</span>
          <span class="slot-daypart">${escapeHTML(slot.timeLabel)}</span>
        </div>
        <div class="dial-wrap">${renderDial(best.score)}</div>
        <div class="fish-name"><span class="badge">${fishIcons(best.score)}</span>${escapeHTML(best.fish.name)}</div>
        <div class="env-mini">🌡️ <b>${slot.env.airTemp}°C</b> · 🌊 <b>${slot.env.wave} m</b><br><span title="${escapeHTML(windTitle)}">🌬️ ${escapeHTML(windLabel)}</span> · ${escapeHTML(slot.env.weather)}</div>
        <div class="top3">${top3}</div>`;
      card.onclick=()=>this.openModal(i);
      card.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); card.click(); } });
      frag.appendChild(card);
    });

    cards.appendChild(frag);
    sizeLayout();
  },
  openModal(activeIndex){
    this.activeIndex=activeIndex;
    const modal=document.getElementById('modal'), sheet=document.getElementById('modalSheet');
    modal.style.display='flex'; setTimeout(()=>sheet.focus(),0);
    this.buildTimeline(activeIndex);
  },
  closeModal(){ document.getElementById('modal').style.display='none'; },
  buildTimeline(active){
    this.activeIndex=active;
    const timeline=document.getElementById('timeline'); timeline.innerHTML='';
    APIModule.slots.forEach((slot,i)=>{
      const el=document.createElement('div'); el.className='slot'+(i===active?' active':''); el.textContent=slot.t; el.onclick=()=>{this.buildTimeline(i);};
      timeline.appendChild(el); if(i===active) this.renderSlot(slot);
    });
  },
  renderSlot(slot){
    document.getElementById('slotTitle').textContent=`${slot.t} · ${slot.timeLabel} · ${slot.env.selectedDate} · ${RegionModule.textMap[App.currentRegion]}`;
    const envGrid=document.getElementById('envGrid');
    const windLabel=`${slot.env.wind} km/sa ${slot.env.windDir}`, windTitle=`${slot.env.wind} km/sa – ${slot.env.windDirLong}`;
    const envItem=(label,val)=>`<div class="env-box"><span class="env-label">${label}</span><span class="env-val">${val}</span></div>`;
    envGrid.innerHTML=
      envItem('Hava',escapeHTML(slot.env.weather)) +
      envItem('Yağış',slot.env.precipProbability+'%') +
      envItem('Doğum',slot.env.sunrise) +
      envItem('Batım',slot.env.sunset) +
      envItem('Sıcaklık',slot.env.airTemp+'°C') +
      `<div class="env-box" title="${escapeHTML(windTitle)}"><span class="env-label">Rüzgar</span><span class="env-val">${escapeHTML(windLabel)}</span></div>` +
      envItem('Dalga',slot.env.wave+' m') +
      envItem('Deniz',slot.env.seaTemp+'°C') +
      envItem('Basınç',slot.env.pressure+' hPa');

    const fishList=document.getElementById('fishList');
    const inRegion=this.inRegionFishes().map(f=>({fish:f,score:ScoringModule.calculate(f,slot.env,slot.timeLabel)})).sort((a,b)=>b.score-a.score);
    const outRegion=this.outRegionFishes().map(f=>({fish:f,score:ScoringModule.calculate(f,slot.env,slot.timeLabel)})).sort((a,b)=>b.score-a.score);
    const moon=DataModule.getMoonData();

    let html='';
    if(!inRegion.length){ html+=`<div class="small">Bu bölge için uygun tür bulunamadı.</div>`; }
    else{
      html+=inRegion.map((x,idx)=>{
        let comment="", c="";
        if(x.score>=90){ comment="Bol av bekleniyor! Harika koşullar 🐟🐟🐟"; c="var(--teal)";}
        else if(x.score>=70){ comment="İyi av ihtimali yüksek. Şansın açık olsun! 🐟🐟"; c="var(--teal)";}
        else if(x.score>=50){ comment="Orta düzeyde aktivite. Sabırlı ol 🐟"; c="var(--brass)";}
        else if(x.score>=30){ comment="Zayıf aktivite. Zor olabilir, ama şansını dene"; c="var(--brass)";}
        else { comment="Çok düşük ihtimal. Bugün başka balıklara bak"; c="var(--coral)";}
        const heavyHint=(slot.env.wave>1.2||slot.env.wind>25)? `<div class="small">💡 Koşullar zor (dalga/rüzgar yüksek). Daha <b>ağır takım</b> ve <b>daha kalın misina</b> tercih edebilirsin.</div>` : "";
        const openAttr = idx===0 ? ' open' : '';
        return `
          <div class="fish">
            <div class="fish-head" onclick="this.nextElementSibling.classList.toggle('open')" role="button" tabindex="0" aria-label="${escapeHTML(x.fish.name)} detaylarını aç" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
              <span>${fishIcons(x.score)} ${escapeHTML(x.fish.name)}</span>
              <span class="fh-score" style="color:${ScoringModule.color(x.score)}">${x.score}%</span>
            </div>
            <div class="detail${openAttr}">
              <div class="bar"><div style="width:${x.score}%;background:${ScoringModule.color(x.score)}"></div></div>
              <div class="av-comment" style="color:${c}">${escapeHTML(comment)}</div>
              <div class="takim-yem"><span class="takim-icon">🎣</span> <span class="small">${escapeHTML(x.fish.takim)}</span></div>
              <div class="takim-yem"><span class="takim-icon">🪱</span> <span class="small">${escapeHTML(x.fish.yem)}</span></div>
              ${heavyHint}
              <div class="moon-line">${moon.emoji} Ay evresi: ${escapeHTML(moon.text)}</div>
            </div>
          </div>`;
      }).join('');
    }
    if(outRegion.length){
      html+=`<div class="small" style="margin-top:14px;opacity:.75">Bölgede nadir / uygun olmayan türler:</div>`;
      html+=outRegion.map(x=>`
        <div class="fish" style="opacity:.7">
          <div class="fish-head" onclick="this.nextElementSibling.classList.toggle('open')" role="button" tabindex="0" aria-label="${escapeHTML(x.fish.name)} detaylarını aç" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
            <span>${escapeHTML(x.fish.name)}</span>
            <span class="fh-score" style="color:${ScoringModule.color(x.score)}">${x.score}%</span>
          </div>
          <div class="detail">
            <div class="nadir">Bu bölgede nadir</div>
            <div class="bar"><div style="width:${x.score}%;background:${ScoringModule.color(x.score)}"></div></div>
            <div class="takim-yem"><span class="takim-icon">🎣</span> <span class="small">${escapeHTML(x.fish.takim)}</span></div>
            <div class="takim-yem"><span class="takim-icon">🪱</span> <span class="small">${escapeHTML(x.fish.yem)}</span></div>
            <div class="moon-line">${moon.emoji} Ay evresi: ${escapeHTML(moon.text)}</div>
          </div>
        </div>`).join('');
    }
    fishList.innerHTML=html;
  }
};

/* === Dikey yerleşim === */
function sizeLayout(){
  const vh=window.innerHeight;
  const headerH=document.querySelector('header')?.getBoundingClientRect().height||0;
  const panelH=document.querySelector('.location-panel')?.getBoundingClientRect().height||0;
  const mapH=document.getElementById('map')?.getBoundingClientRect().height||0;
  const cards=document.getElementById('cards');
  const margins=24;
  const avail=Math.max(220, vh-(headerH+panelH+mapH+margins));
  if(cards){ cards.style.height=`${Math.round(avail)}px`; }
}
window.addEventListener('load',sizeLayout);
window.addEventListener('resize',sizeLayout);
if(window.ResizeObserver){ const ro=new ResizeObserver(()=>sizeLayout()); ro.observe(document.body); }

/* === Modal erişilebilirliği === */
function setupModalInteractions(){
  const modal=document.getElementById('modal');
  const sheet=document.getElementById('modalSheet');
  const closeBtn=document.getElementById('modalClose');
  modal.addEventListener('click',(e)=>{ if(e.target.id==='modal') UIModule.closeModal(); });
  closeBtn.addEventListener('click',()=>UIModule.closeModal());
  closeBtn.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); UIModule.closeModal(); } });
  sheet.addEventListener('keydown',(e)=>{
    if(e.key!=='Tab') return;
    const focusable=sheet.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    const first=focusable[0], last=focusable[focusable.length-1];
    if(!first||!last) return;
    if(e.shiftKey){ if(document.activeElement===first){ last.focus(); e.preventDefault(); } }
    else{ if(document.activeElement===last){ first.focus(); e.preventDefault(); } }
  });
}

/* === Rozet: mevcut konuma git === */
function setupRegionInline(){
  const regionEl=document.getElementById('regionInline'); if(!regionEl) return;
  const goToCurrent=()=>{
    try{
      const lat=App.currentLat, lon=App.currentLon, name=App.currentLocationName||"Mevcut Konum";
      if(MapModule?.map?.flyTo){ MapModule.map.flyTo([lat,lon],12,{duration:0.6}); } else { MapModule.map.setView([lat,lon],12); }
      if(!MapModule.marker){ MapModule.setMarker({lat,lng:lon}, name); }
      else{ MapModule.marker.setLatLng([lat,lon]); MapModule.marker.bindPopup(escapeHTML(name)).openPopup(); }
      regionEl.style.boxShadow="0 0 0 5px rgba(217,160,90,.28)"; setTimeout(()=> regionEl.style.boxShadow="",400);
    }catch(e){ showToast("Mevcut konuma gidilemedi.","error"); }
  };
  regionEl.addEventListener('click',goToCurrent);
  regionEl.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goToCurrent(); } });
}

/* === Sol geolokasyon ikonu: konum al === */
function setupRegionLocateIcon(){
  const icon=document.getElementById('regionLocateIcon'); if(!icon) return;
  const doLocate=()=>{
    if(!navigator.geolocation){ showToast("Tarayıcınız konum desteği sağlamıyor.",'error'); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude,longitude}=pos.coords;
        if(MapModule?.map?.flyTo){ MapModule.map.flyTo([latitude,longitude],12,{duration:0.6}); } else { MapModule.map.setView([latitude,longitude],12); }
        MapModule.setMarker({lat:latitude,lng:longitude},"Benim Konumum");
        App.setLocation(latitude,longitude,"Benim Konumum");
      },
      err=>showToast("Konum alınamadı: "+err.message,'error'),
      { enableHighAccuracy:true, timeout:8000 }
    );
  };
  icon.addEventListener('click',doLocate);
  icon.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); doLocate(); } });
}

/* === Mobil scroll ipucu === */
function setupScrollHint(){
  const hintEl=document.getElementById('scrollHint'), cardsEl=document.getElementById('cards');
  if(!hintEl||!cardsEl) return;
  const key='fishingScrollHintShownAt'; const last=parseInt(localStorage.getItem(key)||'0',10); const now=Date.now(); const dayMs=24*60*60*1000;
  const shouldShow=(now-last)>dayMs;
  if(shouldShow && window.matchMedia('(max-width: 767px)').matches){
    hintEl.style.display='block';
    const onScroll=()=>{ if(cardsEl.scrollTop>20){ hintEl.style.display='none'; localStorage.setItem(key,String(now)); cardsEl.removeEventListener('scroll',onScroll); } };
    cardsEl.addEventListener('scroll',onScroll);
    setTimeout(()=>{ hintEl.style.display='none'; localStorage.setItem(key,String(now)); cardsEl.removeEventListener('scroll',onScroll); },6000);
  } else { hintEl.style.display='none'; }
}

/* === Arama ve Paylaş === */
document.getElementById('searchButton').addEventListener('click',()=>App.searchLocation());
document.getElementById('shareButton').addEventListener('click',()=>{
  const title=document.getElementById('slotTitle').textContent;
  const location=document.getElementById('locationInput').value || App.currentLocationName || "Belirtilen Lokasyon";
  const d=new Date(); d.setDate(d.getDate()+App.currentDateOffset);
  const formattedDate=d.toLocaleDateString('tr-TR',{weekday:'long', day:'numeric', month:'long'});
  const panelUrl=window.location.href;
  const activeIdx=UIModule.activeIndex??0; const activeSlot=APIModule.slots[activeIdx]; const env=activeSlot?.env||{};
  const windLabel=`${env?.wind??'—'} km/sa ${env?.windDirLong||env?.windDir||''}`, waveLabel=`${env?.wave??'—'} m`;
  const text=`🎣 Balık Sonarı Tahmini

📍 ${location}
📅 ${formattedDate}
⏰ ${title}
🌬️ Rüzgar: ${windLabel}
🌊 Dalga: ${waveLabel}

Detaylı tahmin için paneli ziyaret et!
🔗 ${panelUrl}`;
  if(navigator.share){ navigator.share({title:'Balık Sonarı Tahmini', text}).catch(()=> navigator.clipboard.writeText(text).then(()=>showToast("Metin panoya kopyalandı!")) ); }
  else{ navigator.clipboard.writeText(text).then(()=>showToast("Metin panoya kopyalandı!")); }
});

/* === Başlat === */
App.init();
